---
- name: Discover runner VMs and request GitHub registration token
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ansible_python_interpreter: >-
      {{
        '/usr/bin/python3'
        if lookup('ansible.builtin.fileglob', '/usr/bin/python3', errors='ignore')
        else ansible_playbook_python
      }}
    github_runner_repo: "mkrakowitzer/Saas"
    github_runner_vm_names:
      - runner-01
      - runner-02
      - runner-03
      - runner-04
    github_runner_ssh_user: ubuntu
    github_runner_ssh_private_key_file: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
    github_runner_known_hosts_path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
    github_runner_api_token: "{{ lookup('ansible.builtin.env', 'GITHUB_RUNNER_ADMIN_TOKEN') | default('', true) }}"

  tasks:
    - name: Ensure SSH key for runner access exists
      ansible.builtin.stat:
        path: "{{ github_runner_ssh_private_key_file }}"
      register: github_runner_ssh_key_file

    - name: Fail when runner SSH key is missing
      ansible.builtin.assert:
        that:
          - github_runner_ssh_key_file.stat.exists
        fail_msg: "Runner SSH key not found: {{ github_runner_ssh_private_key_file }}"

    - name: Resolve VM IPv4 addresses from libvirt leases
      ansible.builtin.command: "virsh domifaddr {{ item }} --source lease"
      become: true
      register: github_runner_vm_ip_lookup
      changed_when: false
      retries: 12
      delay: 5
      until: github_runner_vm_ip_lookup.rc == 0 and (github_runner_vm_ip_lookup.stdout is search('ipv4'))
      loop: "{{ github_runner_vm_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Build discovered VM host list
      ansible.builtin.set_fact:
        github_runner_discovered_hosts: >-
          {{
            (github_runner_discovered_hosts | default([]))
            +
            [{
              'name': item.item,
              'ip': (
                item.stdout_lines
                | select('search', 'ipv4')
                | first
                | split
                | last
                | split('/')
                | first
              )
            }]
          }}
      loop: "{{ github_runner_vm_ip_lookup.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert discovered runner VM count matches expected count
      ansible.builtin.assert:
        that:
          - (github_runner_discovered_hosts | length) == (github_runner_vm_names | length)
          - (github_runner_discovered_hosts | map(attribute='ip') | reject('equalto', None) | list | length) == (github_runner_vm_names | length)
        fail_msg: "Failed to discover one or more runner VM IP addresses."

    - name: Scan runner host ed25519 keys
      ansible.builtin.command: "ssh-keyscan -T 5 -t ed25519 {{ item.ip }}"
      register: github_runner_keyscan_results
      changed_when: false
      loop: "{{ github_runner_discovered_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add discovered runner host keys to known_hosts
      ansible.builtin.known_hosts:
        path: "{{ github_runner_known_hosts_path }}"
        name: "{{ item.item.ip }}"
        key: "{{ item.stdout_lines | reject('match', '^#') | first }}"
        hash_host: true
        state: present
      loop: "{{ github_runner_keyscan_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Add discovered runner VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: github_runner_targets
        ansible_host: "{{ item.ip }}"
        ansible_user: "{{ github_runner_ssh_user }}"
        ansible_ssh_private_key_file: "{{ github_runner_ssh_private_key_file }}"
      loop: "{{ github_runner_discovered_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Request registration token using GitHub API token
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_runner_repo }}/actions/runners/registration-token"
        method: POST
        headers:
          Accept: "application/vnd.github+json"
          Authorization: "Bearer {{ github_runner_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        status_code: 201
        return_content: true
      register: github_runner_registration_response
      when: github_runner_api_token | length > 0
      no_log: true

    - name: Verify gh authentication for registration token fallback
      ansible.builtin.command: gh auth status
      register: github_runner_gh_auth_status
      changed_when: false
      when: github_runner_api_token | length == 0

    - name: Request registration token using gh CLI fallback
      ansible.builtin.command: >-
        gh api
        --method POST
        /repos/{{ github_runner_repo }}/actions/runners/registration-token
        --jq .token
      register: github_runner_registration_token_cli
      changed_when: false
      when: github_runner_api_token | length == 0
      no_log: true

    - name: Set registration token fact
      ansible.builtin.set_fact:
        github_runner_registration_token: >-
          {{
            github_runner_registration_response.json.token
            if github_runner_api_token | length > 0
            else (github_runner_registration_token_cli.stdout | trim)
          }}
      no_log: true

    - name: Ensure registration token was acquired
      ansible.builtin.assert:
        that:
          - github_runner_registration_token | length > 0
        fail_msg: "Failed to request GitHub runner registration token."
      no_log: true

- name: Install and configure GitHub runner service on discovered VMs
  hosts: github_runner_targets
  gather_facts: true
  become: true
  vars:
    github_runner_repo: "mkrakowitzer/Saas"
    github_runner_url: "https://github.com/{{ github_runner_repo }}"
    github_runner_registration_token: "{{ hostvars['localhost']['github_runner_registration_token'] }}"
  roles:
    - role: github_runner
