---
- name: Discover runner VMs and request GitHub registration token
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/runner_vms.yml
  vars:
    ansible_python_interpreter: >-
      {{
        '/usr/bin/python3'
        if lookup('ansible.builtin.fileglob', '/usr/bin/python3', errors='ignore')
        else ansible_playbook_python
      }}
    github_runner_repo: "mkrakowitzer/Saas"
    github_runner_trust_host_keys_from_keyscan: true
    github_runner_pinned_host_keys: {}
    github_runner_ssh_user: ubuntu
    github_runner_ssh_private_key_file: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
    github_runner_ssh_public_key_file: "{{ github_runner_ssh_private_key_file }}.pub"
    github_runner_known_hosts_path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
    github_runner_api_token: "{{ lookup('ansible.builtin.env', 'GITHUB_RUNNER_ADMIN_TOKEN') | default('', true) }}"

  tasks:
    - name: Ensure SSH key for runner access exists
      ansible.builtin.stat:
        path: "{{ github_runner_ssh_private_key_file }}"
      register: github_runner_ssh_key_file

    - name: Fail when runner SSH key is missing
      ansible.builtin.assert:
        that:
          - github_runner_ssh_key_file.stat.exists
        fail_msg: "Runner SSH key not found: {{ github_runner_ssh_private_key_file }}"

    - name: Ensure runner SSH public key exists
      ansible.builtin.stat:
        path: "{{ github_runner_ssh_public_key_file }}"
      register: github_runner_ssh_public_key_file_stat

    - name: Fail when runner SSH public key is missing
      ansible.builtin.assert:
        that:
          - github_runner_ssh_public_key_file_stat.stat.exists
        fail_msg: "Runner SSH public key not found: {{ github_runner_ssh_public_key_file }}"

    - name: Read runner SSH public key content
      ansible.builtin.set_fact:
        github_runner_ssh_public_key: "{{ lookup('ansible.builtin.file', github_runner_ssh_public_key_file) | trim }}"

    - name: Ensure runner SSH public key content is not empty
      ansible.builtin.assert:
        that:
          - github_runner_ssh_public_key | length > 0
        fail_msg: "Runner SSH public key is empty: {{ github_runner_ssh_public_key_file }}"

    - name: Build discovered VM host list from configured static addresses
      ansible.builtin.set_fact:
        github_runner_discovered_hosts: "{{ runner_vms }}"

    - name: Assert discovered runner VM count matches expected count
      ansible.builtin.assert:
        that:
          - (github_runner_discovered_hosts | length) == (runner_vms | length)
          - (github_runner_discovered_hosts | map(attribute='ipv4_address') | reject('equalto', '') | list | length) == (runner_vms | length)
          - (github_runner_discovered_hosts | map(attribute='ipv4_address') | list | unique | length) == (runner_vms | length)
        fail_msg: >-
          Missing or duplicate runner IP environment variables.
          Set RUNNER_01_IP, RUNNER_02_IP, RUNNER_03_IP, and RUNNER_04_IP.

    - name: Ensure known_hosts directory exists
      ansible.builtin.file:
        path: "{{ github_runner_known_hosts_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Build pinned host key entries for discovered hosts
      ansible.builtin.set_fact:
        github_runner_pinned_host_entries: >-
          {{
            (github_runner_pinned_host_entries | default([]))
            +
            [{
              'name': item.name,
              'ip': item.ipv4_address,
              'key': (
                github_runner_pinned_host_keys.get(item.name)
                or github_runner_pinned_host_keys.get(item.ipv4_address)
                or ''
              )
            }]
          }}
      loop: "{{ github_runner_discovered_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Build list of hosts that require keyscan
      ansible.builtin.set_fact:
        github_runner_hosts_requiring_scan: >-
          {{
            github_runner_pinned_host_entries
            | selectattr('key', 'equalto', '')
            | list
          }}

    - name: Require pinned host keys when trust-on-first-use is disabled
      ansible.builtin.assert:
        that:
          - github_runner_hosts_requiring_scan | length == 0
        fail_msg: >-
          Missing pinned SSH host keys for one or more runner hosts.
          Set github_runner_pinned_host_keys with trusted ed25519 keys,
          or set github_runner_trust_host_keys_from_keyscan=true.
      when: not github_runner_trust_host_keys_from_keyscan

    - name: Warn when host keys are accepted from ssh-keyscan
      ansible.builtin.debug:
        msg: >-
          github_runner_trust_host_keys_from_keyscan=true accepts host keys from ssh-keyscan.
          For stronger verification, provide github_runner_pinned_host_keys and set
          github_runner_trust_host_keys_from_keyscan=false.
      when:
        - github_runner_trust_host_keys_from_keyscan
        - github_runner_hosts_requiring_scan | length > 0

    - name: Add pinned runner host keys to known_hosts
      ansible.builtin.known_hosts:
        path: "{{ github_runner_known_hosts_path }}"
        name: "{{ item.ip }}"
        key: "{{ item.key }}"
        hash_host: true
        state: present
      loop: "{{ github_runner_pinned_host_entries | rejectattr('key', 'equalto', '') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Scan runner host ed25519 keys for unpinned hosts
      ansible.builtin.command: "ssh-keyscan -T 5 -t ed25519 {{ item.ip }}"
      register: github_runner_keyscan_results
      changed_when: false
      retries: 6
      delay: 5
      until: >
        github_runner_keyscan_results.rc == 0 and
        (github_runner_keyscan_results.stdout_lines | reject('match', '^#') | list | length) > 0
      failed_when: >
        (github_runner_keyscan_results.stdout_lines | reject('match', '^#') | list | length) == 0
      when:
        - github_runner_trust_host_keys_from_keyscan
        - github_runner_hosts_requiring_scan | length > 0
      loop: "{{ github_runner_hosts_requiring_scan }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add scanned runner host keys to known_hosts
      ansible.builtin.known_hosts:
        path: "{{ github_runner_known_hosts_path }}"
        name: "{{ item.item.ip }}"
        key: "{{ item.stdout_lines | reject('match', '^#') | first }}"
        hash_host: true
        state: present
      loop: "{{ github_runner_keyscan_results.results }}"
      when:
        - github_runner_trust_host_keys_from_keyscan
        - github_runner_hosts_requiring_scan | length > 0
      loop_control:
        label: "{{ item.item.name }}"

    - name: Add discovered runner VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: github_runner_targets
        ansible_host: "{{ item.ipv4_address }}"
        ansible_user: "{{ github_runner_ssh_user }}"
        ansible_ssh_private_key_file: "{{ github_runner_ssh_private_key_file }}"
      loop: "{{ github_runner_discovered_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Request registration token using GitHub API token
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_runner_repo }}/actions/runners/registration-token"
        method: POST
        headers:
          Accept: "application/vnd.github+json"
          Authorization: "Bearer {{ github_runner_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        status_code: 201
        return_content: true
      register: github_runner_registration_response
      when: github_runner_api_token | length > 0
      no_log: true

    - name: Verify gh authentication for registration token fallback
      ansible.builtin.command: gh auth status
      register: github_runner_gh_auth_status
      changed_when: false
      when: github_runner_api_token | length == 0

    - name: Request registration token using gh CLI fallback
      ansible.builtin.command: >-
        gh api
        --method POST
        /repos/{{ github_runner_repo }}/actions/runners/registration-token
        --jq .token
      register: github_runner_registration_token_cli
      changed_when: false
      when: github_runner_api_token | length == 0
      no_log: true

    - name: Set registration token fact
      ansible.builtin.set_fact:
        github_runner_registration_token: >-
          {{
            github_runner_registration_response.json.token
            if github_runner_api_token | length > 0
            else (github_runner_registration_token_cli.stdout | trim)
          }}
      no_log: true

    - name: Ensure registration token was acquired
      ansible.builtin.assert:
        that:
          - github_runner_registration_token | length > 0
        fail_msg: "Failed to request GitHub runner registration token."
      no_log: true

- name: Install and configure GitHub runner service on discovered VMs
  hosts: github_runner_targets
  gather_facts: true
  become: true
  vars:
    github_runner_repo: "{{ hostvars['localhost']['github_runner_repo'] | default('mkrakowitzer/Saas') }}"
    github_runner_url: "https://github.com/{{ github_runner_repo }}"
    github_runner_registration_token: "{{ hostvars['localhost']['github_runner_registration_token'] }}"
    github_runner_ssh_user: "{{ hostvars['localhost']['github_runner_ssh_user'] | default('ubuntu') }}"
  pre_tasks:
    - name: Ensure SSH directory exists for runner SSH user
      ansible.builtin.file:
        path: "/home/{{ github_runner_ssh_user }}/.ssh"
        state: directory
        owner: "{{ github_runner_ssh_user }}"
        group: "{{ github_runner_ssh_user }}"
        mode: "0700"

    - name: Ensure host SSH public key is authorized for runner SSH user
      ansible.builtin.lineinfile:
        path: "/home/{{ github_runner_ssh_user }}/.ssh/authorized_keys"
        line: "{{ hostvars['localhost']['github_runner_ssh_public_key'] }}"
        create: true
        owner: "{{ github_runner_ssh_user }}"
        group: "{{ github_runner_ssh_user }}"
        mode: "0600"
        state: present
  roles:
    - role: github_runner
