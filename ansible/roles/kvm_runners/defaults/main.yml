---
kvm_runners_image_dir: /var/lib/libvirt/images/github-runners
kvm_runners_cloud_init_dir: "{{ kvm_runners_image_dir }}/cloud-init"
kvm_runners_network_mode: nat
kvm_runners_network_name: default
kvm_runners_bridge_name: ""
kvm_runners_direct_interface: ""

kvm_runners_cloud_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
kvm_runners_cloud_image_filename: noble-server-cloudimg-amd64.img
kvm_runners_cloud_image_path: "{{ kvm_runners_image_dir }}/{{ kvm_runners_cloud_image_filename }}"
kvm_runners_cloud_image_backing_format: qcow2
kvm_runners_os_variant: generic

kvm_runners_lease_retries: 30
kvm_runners_lease_delay_seconds: 10

kvm_runners_host_manage_ksm: "{{ ansible_facts.os_family == 'RedHat' }}"
kvm_runners_host_ksm_services:
  - ksm
  - ksmtuned
kvm_runners_host_swapfiles:
  - path: /swapfile2
    size: 8G
    priority: -3

kvm_runners_vm_ipv4_prefix: 24
kvm_runners_vm_ipv4_gateway: ""
kvm_runners_vm_ipv4_dns_servers: []
kvm_runners_vm_network_renderer: ""

kvm_runners_vms:
  - name: runner-01
    vcpus: 2
    memory_mb: 4096
    disk_size_gb: 30
  - name: runner-02
    vcpus: 2
    memory_mb: 4096
    disk_size_gb: 30
  - name: runner-03
    vcpus: 2
    memory_mb: 4096
    disk_size_gb: 30
  - name: runner-04
    vcpus: 2
    memory_mb: 4096
    disk_size_gb: 30

kvm_runners_vm_user: ubuntu
kvm_runners_vm_user_passwordless_sudo: true
kvm_runners_vm_admin_groups:
  - adm
  - sudo
kvm_runners_vm_packages:
  - qemu-guest-agent
kvm_runners_vm_enable_qemu_guest_agent: true
kvm_runners_default_ssh_public_key_path: "{{ lookup('env', 'HOME') + '/.ssh/id_ed25519.pub' }}"
kvm_runners_ssh_authorized_keys:
  - "{{ lookup('file', kvm_runners_default_ssh_public_key_path, errors='warn') | trim }}"

kvm_runners_debian_packages:
  - qemu-kvm
  - qemu-utils
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
  - cloud-image-utils
  - bridge-utils
  - genisoimage

kvm_runners_redhat_packages:
  - qemu-kvm
  - qemu-img
  - libvirt
  - libvirt-client
  - virt-install
  - cloud-utils-growpart
  - bridge-utils
  - genisoimage
  - ksmtuned
