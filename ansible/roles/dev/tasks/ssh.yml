---
- name: "Create .ssh"
  ansible.builtin.file:
    path: "~/.ssh"
    state: directory
    mode: '0750'

- name: Remove old versions of openssh git
  become: true
  ansible.builtin.file:
    path: "/tmp/openssh-portable"
    state: absent

- name: Remove old versions of openssh install
  become: true
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/openssh"
    state: absent

- name: Clone openssh
  ansible.builtin.git:
    repo: https://github.com/openssh/openssh-portable.git
    dest: "/tmp/openssh-portable"
    accept_hostkey: true
    depth: 1
    version: "V_10_2_P1"
  environment:
    GIT_CONFIG_GLOBAL: /dev/null

