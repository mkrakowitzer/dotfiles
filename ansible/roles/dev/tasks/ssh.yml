- name: Run autoreconf
  ansible.builtin.command: autoreconf
  args:
    chdir: "/tmp/openssh-portable"
  changed_when: false

- name: Configure openssh source for build
  # Flags paths will just be ignored if they don't exist
  ansible.builtin.shell: "./configure LDFLAGS=-L/opt/homebrew/lib CFLAGS=-I/opt/homebrew/include --prefix={{ ansible_facts['env']['HOME'] }}//.local/openssh"
  args:
    chdir: "/tmp/openssh-portable"
  changed_when: false

- name: Build openssh from source
  ansible.builtin.command: make
  args:
    chdir: "/tmp/openssh-portable"
  changed_when: false

- name: Make /var/empty
  become: true
  ansible.builtin.file:
    path: "/var/empty"
    state: directory
    owner: "root"
    group: "root"
    mode: '755'

- name: Install openssh
  ansible.builtin.command: make install
  args:
    chdir: "/tmp/openssh-portable"
  changed_when: false

- name: Make .ssh directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: '0700'

- name: Copy ssh config
  ansible.builtin.copy:
    src: "~/personal/dotfiles/ssh_config"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    mode: '0600'
