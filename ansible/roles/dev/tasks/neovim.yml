---
- name: Remove old versions of neovim
  become: true
  ansible.builtin.file:
    path: "/tmp/neovim"
    state: absent

- name: Clone neovim
  ansible.builtin.git:
    repo: https://github.com/neovim/neovim.git
    dest: "/tmp/neovim"
    accept_hostkey: true
    depth: 1
    version: stable
  environment:
    GIT_CONFIG_GLOBAL: /dev/null

- name: Neovim Make
  become: true
  ansible.builtin.command: make CMAKE_BUILD_TYPE=Release install
  args:
    chdir: "/tmp/neovim"

- name: Check neovim config git status
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ansible_facts['env']['HOME'] }}/personal/nvim"
      - status
      - --porcelain
  register: neovim_config_git_status
  changed_when: false
  failed_when: false

- name: Clone neovim config
  ansible.builtin.git:
    repo: https://github.com/mkrakowitzer/neovimrc.git
    dest: "~/personal/nvim"
    accept_hostkey: true
  environment:
    GIT_CONFIG_GLOBAL: /dev/null
  when: neovim_config_git_status.rc | int > 0 or (neovim_config_git_status.stdout | trim | length) < 1

- name: Skip neovim config update when local modifications exist
  ansible.builtin.debug:
    msg: "Skipping neovim config update because local modifications exist in ~/personal/nvim."
  when: neovim_config_git_status.rc | int < 1 and (neovim_config_git_status.stdout | trim | length) > 0

- name: Remove old neovim config
  ansible.builtin.file:
    path: "~/.config/nvim"
    state: absent

- name: Create soft link
  ansible.builtin.file:
    src: "~/personal/nvim"
    dest: "~/.config/nvim"
    state: link

- name: Install goimports
  ansible.builtin.command: go install -v golang.org/x/tools/cmd/goimports@latest
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin:{{ ansible_facts['env']['PATH'] }}"
    GOBIN: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin"
    GOPATH: "{{ ansible_facts['env']['HOME'] }}/.local/go"

- name: Install golangci-lint
  ansible.builtin.command: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin:{{ ansible_facts['env']['PATH'] }}"
    GOBIN: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin"
    GOPATH: "{{ ansible_facts['env']['HOME'] }}/.local/go"

- name: Install goimports-reviser
  ansible.builtin.command: go install -v github.com/incu6us/goimports-reviser/v3@latest
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin:{{ ansible_facts['env']['PATH'] }}"
    GOBIN: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin"
    GOPATH: "{{ ansible_facts['env']['HOME'] }}/.local/go"

- name: Create yamllint directory
  ansible.builtin.file:
    path: "~/.config/yamllint"
    state: directory
    mode: 0755

- name: Create yamllint config
  ansible.builtin.file:
    src: "~/personal/dotfiles/yamllint_config"
    dest: "~/.config/yamllint/config"
    state: link

- name: Ensure ~/.local/bin exists for task-only runs
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0750"

- name: Install yamllint and mdformat
  ansible.builtin.pip:
    name: "{{ item }}"
    state: present
    executable: "{{ ansible_facts['env']['HOME'] }}/.local/python/bin/pip"
  with_items:
    - yamllint
    - mdformat
    - ansible-lint
    - codespell

- name: Check golangci-lint binary
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin/golangci-lint"
  register: golangci_lint_binary

- name: Link golangci-lint into ~/.local/bin
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/go/bin/golangci-lint"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/golangci-lint"
    state: link
    force: true
  when: golangci_lint_binary.stat.exists

- name: Check codespell binary
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/python/bin/codespell"
  register: codespell_binary

- name: Link codespell into ~/.local/bin
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/python/bin/codespell"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/codespell"
    state: link
    force: true
  when: codespell_binary.stat.exists

- name: Install fixjson
  ansible.builtin.command: npm install -g fixjson
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/n/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install markdownlint-cl
  ansible.builtin.command: npm install -g markdownlint-cli
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/n/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install tree-sitter-cli
  ansible.builtin.command: npm install -g tree-sitter-cli
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/npm/bin/tree-sitter"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/n/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Check tree-sitter binary
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/npm/bin/tree-sitter"
  register: dev_tree_sitter_binary

- name: Link tree-sitter into ~/.local/bin
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/npm/bin/tree-sitter"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/tree-sitter"
    state: link
    force: true
  when: dev_tree_sitter_binary.stat.exists

- name: Validate tree-sitter availability
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/tree-sitter --version"
  changed_when: false

- name: Download yq
  ansible.builtin.get_url:
    url: https://github.com/mikefarah/yq/releases/download/{{ dev_yq_version }}/yq_linux_amd64.tar.gz
    dest: /tmp/yq{{ dev_yq_version }}.tar.gz
    mode: 0644

- name: Uncompress yq binary
  ansible.builtin.unarchive:
    src: /tmp/yq{{ dev_yq_version }}.tar.gz
    dest: ~/.local/bin
    remote_src: true
    creates: ~/.local/bin/yq_linux_amd64
    mode: 0755

- name: Create yq symlink
  ansible.builtin.file:
    src: ~/.local/bin/yq_linux_amd64
    dest: ~/.local/bin/yq
    state: link
    force: true
