---
- name: Get the vale versions information
  ansible.builtin.uri:
    url: https://api.github.com/repos/errata-ai/vale/releases/latest
    method: GET
    return_content: true
    headers:
      Accept: application/vnd.github.v3+json
  register: vale_versions_response
  failed_when: vale_versions_response.status != 200

- name: Set the latest stable vale version as a fact
  ansible.builtin.set_fact:
    vale_version: "{{ vale_versions_response.json.tag_name }}"

- name: Download vale
  vars:
    arch_map:
      x86_64: "64-bit"
      arm64: "arm64"
    system_map:
      Linux: "Linux"
      Darwin: "macOS"
  ansible.builtin.get_url:
    url: "https://github.com/errata-ai/vale/releases/download/{{ vale_version }}/vale_{{ vale_version | regex_replace('^v', '') }}_{{ system_map[ansible_facts['system']] }}_{{ arch_map[ansible_facts['architecture']] }}.tar.gz"
    dest: "/tmp"
    mode: 0644

- name: Extract vale
  vars:
    arch_map:
      x86_64: "64-bit"
      arm64: "arm64"
    system_map:
      Linux: "Linux"
      Darwin: "macOS"
  ansible.builtin.unarchive:
    src: "/tmp/vale_{{ vale_version | regex_replace('^v', '') }}_{{ system_map[ansible_facts['system']] }}_{{ arch_map[ansible_facts['architecture']] }}.tar.gz"
    dest: "~/.local/bin"
    remote_src: true

- name: Ensure Vale styles directory exists
  ansible.builtin.file:
    path: "{{ dev_vale_styles_path | regex_replace('^~', ansible_facts['user_dir']) }}"
    state: directory
    owner: "{{ dev_username }}"
    group: "{{ effective_group }}"
    mode: "0750"

- name: Write default Vale configuration
  ansible.builtin.template:
    src: vale.ini.j2
    dest: "{{ dev_vale_config_path | regex_replace('^~', ansible_facts['user_dir']) }}"
    owner: "{{ dev_username }}"
    group: "{{ effective_group }}"
    mode: "0640"
