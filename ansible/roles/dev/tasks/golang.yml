---
- name: Remove old golang
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/go"
    state: absent
  become: true

- name: Get the Go versions information
  ansible.builtin.uri:
    url: "https://go.dev/dl/?mode=json"
    method: GET
    return_content: true
    headers:
      Accept: "application/json"
  register: go_versions_response
  failed_when: go_versions_response.status != 200

- name: Set the latest stable Go version as a fact
  ansible.builtin.set_fact:
    golang_version: "{{ (go_versions_response.json | selectattr('stable', 'equalto', true) | first).version }}"

- name: Download golang binary
  ansible.builtin.get_url:
    url: "https://golang.org/dl/{{ golang_version }}.{{ ansible_facts['system'] | lower }}-{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}.tar.gz"
    dest: "/tmp/{{ golang_version }}.{{ ansible_facts['system'] | lower }}-{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}.tar.gz"
    mode: 0644

- name: Uncompress Golang binary
  ansible.builtin.unarchive:
    src: "/tmp/{{ golang_version }}.{{ ansible_facts['system'] | lower }}-{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}.tar.gz"
    dest: ~/.local
    remote_src: true
    creates: ~/.local/go
    mode: 0755
